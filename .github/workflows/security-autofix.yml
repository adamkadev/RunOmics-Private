name: Security autofix

on:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

# Two jobs, so that no job both runs dependency code (npm install scripts) and holds a write token.
# A pull request rather than a push: the checks prove the tree still builds, not that the app behaves.
permissions:
  contents: read

concurrency:
  group: security-autofix
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply non-breaking audit fixes
        run: npm audit fix || true

      - name: Detect lock file changes
        id: diff
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        if: steps.diff.outputs.changed == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.diff.outputs.changed == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Hand the fix to the propose job
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-fix
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1

  propose:
    needs: audit
    if: needs.audit.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # To start CI and E2E on the branch: a push made with GITHUB_TOKEN triggers no workflow.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Into its own directory, so only the two expected files from the audit job get copied over.
      - name: Download the fix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audit-fix
          path: audit-fix

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/npm-audit-fix
        run: |
          set -eo pipefail
          cp audit-fix/package.json audit-fix/package-lock.json .
          rm -rf audit-fix

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One long-lived branch, or a weekly schedule leaves a trail of PRs.
          git checkout -B "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore(deps): apply npm audit fix"
          git push --force-with-lease origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --head "$BRANCH" \
              --title "chore(deps): apply npm audit fix" \
              --body "Automated \`npm audit fix\` run. Lint, typecheck and the unit suite passed before the PR was opened; CI and E2E are started on this branch by the same workflow."
          fi

          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run e2e.yml --ref "$BRANCH"
