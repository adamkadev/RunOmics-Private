name: Security autofix

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A pull request, not a push to the default branch: `npm audit fix` can bump a
# transitive dependency across a minor and the three checks below only prove the
# tree still builds, not that the app still behaves. Opening a PR keeps the
# branch protection and the human read that a direct push skips.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: security-autofix
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply non-breaking audit fixes
        run: npm audit fix || true

      - name: Detect lock file changes
        id: diff
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        if: steps.diff.outputs.changed == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.diff.outputs.changed == 'true'
        run: npx tsc --noEmit

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/npm-audit-fix
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One long-lived branch, force-pushed: a weekly schedule would
          # otherwise leave a trail of near-identical open PRs.
          git checkout -B "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore(deps): apply npm audit fix"
          git push --force-with-lease origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --head "$BRANCH" \
              --title "chore(deps): apply npm audit fix" \
              --body "Automated \`npm audit fix\` run. Lint, typecheck and the unit suite passed on this branch before the PR was opened."
          fi
