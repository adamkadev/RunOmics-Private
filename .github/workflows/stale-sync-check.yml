name: Stale Sync Check

on:
  # Independent of sync.yml so a broken or silent sync still gets caught; off the hour on purpose.
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    uses: ./.github/workflows/internal-notify.yml
    # Only the secrets the job reads, not every one this repository holds.
    secrets:
      APP_URL: ${{ secrets.APP_URL }}
      INTERNAL_NOTIFY_SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
    with:
      endpoint: stale-sync-check
      label: Trigger stale sync check
