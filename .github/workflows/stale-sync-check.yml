name: Stale Sync Check

on:
  # 05:41 UTC daily - independent of sync.yml so a broken/silent sync still gets
  # caught. Off the hour on purpose - see daily-session-reminder.yml.
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    uses: ./.github/workflows/internal-notify.yml
    # Only the two secrets the job reads, not every one this repository
    # holds. Each profile's environment secret still wins over these.
    secrets:
      APP_URL: ${{ secrets.APP_URL }}
      INTERNAL_NOTIFY_SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
    with:
      endpoint: stale-sync-check
      label: Trigger stale sync check
