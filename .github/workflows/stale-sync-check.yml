name: Stale Sync Check

on:
  # 6:00 UTC daily - independent of sync.yml so a broken/silent sync still gets caught.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  notify:
    uses: ./.github/workflows/internal-notify.yml
    secrets: inherit
    with:
      endpoint: stale-sync-check
      label: Trigger stale sync check
