name: Audit Garmin Capabilities

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Which Garmin environment to probe"
        type: choice
        options: [all, adam, lamiaa]
        default: all

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      as_of: ${{ steps.date.outputs.as_of }}
    steps:
      - id: pick
        env:
          REQUESTED: ${{ inputs.profile }}
        run: |
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "all" ]; then
            echo 'matrix=["adam","lamiaa"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"$REQUESTED\"]" >> "$GITHUB_OUTPUT"
          fi
      - id: date
        run: echo "as_of=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  probe:
    needs: profiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.profiles.outputs.matrix) }}
    environment: ${{ matrix.profile }}
    concurrency:
      group: capability-audit-${{ matrix.profile }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check profile configuration
        env:
          DECLARED_PROFILE: ${{ vars.PROFILE }}
          GARMIN_SECRET: ${{ secrets.GARMIN_SECRET }}
        run: |
          if [ "$DECLARED_PROFILE" != "${{ matrix.profile }}" ]; then
            echo "::error::Environment '${{ matrix.profile }}' does not declare PROFILE=${{ matrix.profile }}."
            exit 1
          fi
          if [ -z "$GARMIN_SECRET" ]; then
            echo "::error::Environment '${{ matrix.profile }}' is missing GARMIN_SECRET."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

      - name: Connect Cloudflare WARP
        run: |
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 3
          warp-cli --accept-tos status

      - name: Run sanitized capability probe
        env:
          GARMIN_SECRET: ${{ secrets.GARMIN_SECRET }}
          GARMIN_OAUTH_CONSUMER_KEY: ${{ vars.GARMIN_OAUTH_CONSUMER_KEY }}
          GARMIN_OAUTH_CONSUMER_SECRET: ${{ vars.GARMIN_OAUTH_CONSUMER_SECRET }}
        run: |
          mkdir -p capability-report
          python scripts/diagnostics/probe_garmin_capabilities.py \
            --as-of "${{ needs.profiles.outputs.as_of }}" \
            --output "capability-report/${{ matrix.profile }}.json"

      - name: Disconnect Cloudflare WARP
        if: always()
        run: warp-cli --accept-tos disconnect || true

      - name: Upload sanitized profile report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: garmin-capability-${{ matrix.profile }}-${{ github.run_id }}
          path: capability-report/${{ matrix.profile }}.json
          if-no-files-found: error
          retention-days: 30

  compare:
    if: ${{ always() && inputs.profile == 'all' }}
    needs: [profiles, probe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download sanitized profile reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: garmin-capability-*-${{ github.run_id }}
          path: downloaded-reports
          merge-multiple: true

      - name: Build comparison bundle
        run: |
          python scripts/diagnostics/compare_reports.py \
            --adam downloaded-reports/adam.json \
            --lamiaa downloaded-reports/lamiaa.json \
            --output-dir comparison-bundle

      - name: Upload sanitized comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: garmin-capability-comparison-${{ github.run_id }}
          path: comparison-bundle/
          if-no-files-found: error
          retention-days: 30
