name: Visual

# On demand only, before a perf or visual pull request; e2e/visual/README.md says how to update the baselines.
on:
  workflow_dispatch:
    inputs:
      update:
        description: Update the baselines and commit them to this branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Refuse to rewrite main's baselines
        if: inputs.update && github.ref == 'refs/heads/main'
        run: |
          echo "::error::Update the baselines on a branch, then merge it."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ inputs.update }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Shared with CI and E2E under the same key: a hit skips `npm ci`.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Read Playwright's version
        id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      # A key of its own: E2E's also holds WebKit, which this cache would otherwise save without.
      - name: Restore Playwright's Chromium
        id: playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright's Chromium
        if: steps.playwright.outputs.cache-hit != 'true'
        run: |
          for try in 1 2 3; do
            npx playwright install --only-shell chromium && exit 0
            sleep 15
          done
          exit 1

      # A run page reads its note from the Firestore emulator, which needs Java 21; the runner ships it, not as default.
      - name: Use the preinstalled JDK 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      - name: Restore the Firebase emulators
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - name: Run the visual checks
        env:
          UPDATE: ${{ inputs.update }}
        run: |
          if [ "$UPDATE" = true ]; then
            npm run test:visual -- --update-snapshots=changed
          else
            npm run test:visual
          fi

      - name: Commit the new baselines
        if: inputs.update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898244+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual/baselines
          if git diff --cached --quiet; then
            echo "No baseline changed."
          else
            git commit -m "test(visual): update the baselines"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Upload the report and its diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/visual/
          retention-days: 14
