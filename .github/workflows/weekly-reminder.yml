name: Weekly Goal Reminder

on:
  # 17:37 in Paris in summer, 16:37 in winter; off the hour on purpose.
  schedule:
    - cron: "37 15 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    uses: ./.github/workflows/internal-notify.yml
    # Only the secrets the job reads, not every one this repository holds.
    secrets:
      APP_URL: ${{ secrets.APP_URL }}
      INTERNAL_NOTIFY_SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
    with:
      endpoint: weekly-reminder
      label: Trigger weekly reminder
