name: Weekly Goal Reminder

on:
  # 15:37 UTC = 17:37 Paris time (CEST), 16:37 in winter (CET). Off the hour on
  # purpose - see daily-session-reminder.yml.
  schedule:
    - cron: "37 15 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    uses: ./.github/workflows/internal-notify.yml
    secrets: inherit
    with:
      endpoint: weekly-reminder
      label: Trigger weekly reminder
