name: Weekly Goal Reminder

on:
  # 16:00 UTC = 18:00 Paris time (CEST). Drifts to 17:00 Paris time in winter (CET).
  schedule:
    - cron: "0 16 * * 5"
  workflow_dispatch:

jobs:
  notify:
    uses: ./.github/workflows/internal-notify.yml
    secrets: inherit
    with:
      endpoint: weekly-reminder
      label: Trigger weekly reminder
