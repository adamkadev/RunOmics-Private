name: Sync Garmin Activities
# Each run names the profile it syncs, "(all)" for the nightly one: the app's
# Sync button reads the runs back to hold a second sync while one is going and
# to space manual ones out (src/lib/syncLimits.ts), and one workflow serves
# every athlete's deployment.
run-name: Sync Garmin Activities (${{ inputs.profile || 'all' }})

on:
  schedule:
    # Off the hour on purpose: scheduled runs on the hour are the ones GitHub
    # delays most - "0 0" started around 03:05 UTC night after night.
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new activities to sync (leave empty for all)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (fetch but don't write)"
        type: boolean
        default: false
      force:
        description: "Re-sync all activities (rebuilds every record)"
        type: boolean
        default: false
      profile:
        description: "Which deployment to sync"
        type: choice
        options: [all, adam, lamiaa]
        default: all

permissions:
  contents: read

jobs:
  # Which profiles this run covers. A manual dispatch carries options that only
  # ever make sense for one dataset (--force rebuilds every record), so it can
  # target a single profile; the nightly schedule always runs them all.
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          REQUESTED: ${{ inputs.profile }}
        run: |
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "all" ]; then
            echo 'matrix=["adam","lamiaa"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"$REQUESTED\"]" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: profiles
    runs-on: ubuntu-latest
    # A hung WARP connect or a Garmin call that never returns would otherwise
    # hold a runner for the default six hours, nightly, per profile.
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      # One profile's Garmin login expiring must not cancel everyone else's sync.
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.profiles.outputs.matrix) }}

    # Per-profile secrets live in a GitHub Environment of the same name, so every
    # `secrets.*` below resolves to that profile's own value with no renaming.
    # See docs/personal-deployments.md.
    environment: ${{ matrix.profile }}

    # A manual run must never overlap the nightly one for the same profile: both
    # push to that profile's data repository. Different profiles are independent.
    concurrency:
      group: sync-${{ matrix.profile }}
      cancel-in-progress: false

    env:
      # One complete, server-only workspace for fetch -> Garmin sync -> push.
      RUNOMICS_DATA_DIR: data

    steps:
      # The sync pushes with the data repository's own token, never with
      # GITHUB_TOKEN, so nothing needs the checkout's credentials afterwards -
      # and third-party code (garth, pip packages) runs in this job.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two failure modes worth stopping before Garmin is ever contacted.
      #
      # First: naming an environment does NOT hide the repository-level secrets.
      # An environment that doesn't exist yet, or that was created but never
      # populated, therefore falls back to whatever is set repository-wide - so a
      # half-configured profile would sync someone else's Garmin account into
      # someone else's data repository. Every environment must declare a variable
      # PROFILE matching its own name; nothing inherited can satisfy that for more
      # than one profile.
      #
      # Second: without the data repository configured, the sync would start
      # from an incomplete workspace instead of the canonical private dataset.
      - name: Check the sync configuration
        env:
          DECLARED_PROFILE: ${{ vars.PROFILE }}
          RUNOMICS_DATA_REPO_URL: ${{ secrets.RUNOMICS_DATA_REPO_URL }}
          RUNOMICS_DATA_REPO_TOKEN: ${{ secrets.RUNOMICS_DATA_REPO_TOKEN }}
          GARMIN_SECRET: ${{ secrets.GARMIN_SECRET }}
          PRIVACY_ZONES: ${{ secrets.PRIVACY_ZONES }}
          PRIVACY_RADIUS_M: ${{ secrets.PRIVACY_RADIUS_M }}
        run: |
          if [ "$DECLARED_PROFILE" != "${{ matrix.profile }}" ]; then
            echo "::error::Environment '${{ matrix.profile }}' does not declare PROFILE=${{ matrix.profile }} (got '${DECLARED_PROFILE:-unset}')."
            echo "Its secrets are unset or inherited from the repository, which would sync"
            echo "the wrong athlete. See docs/personal-deployments.md."
            exit 1
          fi

          MISSING=""
          [ -n "$RUNOMICS_DATA_REPO_URL" ]   || MISSING="$MISSING RUNOMICS_DATA_REPO_URL"
          [ -n "$RUNOMICS_DATA_REPO_TOKEN" ] || MISSING="$MISSING RUNOMICS_DATA_REPO_TOKEN"
          [ -n "$GARMIN_SECRET" ]            || MISSING="$MISSING GARMIN_SECRET"
          # Without these the sync refuses every GPS activity; failing here says
          # why before Garmin is contacted.
          [ -n "$PRIVACY_ZONES" ]            || MISSING="$MISSING PRIVACY_ZONES"
          [ -n "$PRIVACY_RADIUS_M" ]         || MISSING="$MISSING PRIVACY_RADIUS_M"
          if [ -n "$MISSING" ]; then
            echo "::error::Environment '${{ matrix.profile }}' is missing secret(s):$MISSING"
            echo "Every profile syncs into its own private data repository and never"
            echo "commits anything back here. See docs/personal-deployments.md."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Fetch current private data
        env:
          RUNOMICS_DATA_REPO_URL: ${{ secrets.RUNOMICS_DATA_REPO_URL }}
          RUNOMICS_DATA_REPO_TOKEN: ${{ secrets.RUNOMICS_DATA_REPO_TOKEN }}
        run: node scripts/fetch_private_data.mjs data

      - name: Restore FIT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fit-cache
          key: fit-cache-${{ matrix.profile }}-${{ hashFiles('data/activities/**') }}
          restore-keys: |
            fit-cache-${{ matrix.profile }}-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      # Hash-locked: this job holds GARMIN_SECRET and the data repository's
      # write token, so nothing may be installed that the lock did not pin.
      - name: Install Python dependencies
        run: pip install --require-hashes -r scripts/requirements.txt

      - name: Install Cloudflare WARP
        timeout-minutes: 5
        run: |
          set -euo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cloudflare-warp
          # Recorded, not pinned: the repository keeps only current versions, so
          # a pin breaks the sync the day Cloudflare publishes the next one. The
          # log is what makes "which build started failing" answerable later.
          echo "cloudflare-warp $(dpkg-query -W -f='${Version}' cloudflare-warp)"

      # Garmin refuses GitHub's datacenter ranges, so the sync only reaches it
      # through WARP. This step used to sleep 3 seconds and print the status
      # without reading it: a tunnel that never came up surfaced minutes later
      # as a Garmin auth error, which is the wrong thing to go looking at.
      - name: Connect Cloudflare WARP
        timeout-minutes: 5
        run: |
          set -euo pipefail

          registered=false
          for attempt in 1 2 3; do
            if warp-cli --accept-tos registration new; then
              registered=true
              break
            fi
            echo "::warning::WARP registration attempt ${attempt} failed; retrying."
            sleep $((attempt * 10))
          done
          if [ "$registered" != true ]; then
            echo "::error::WARP registration failed three times."
            exit 1
          fi

          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect

          # Cloudflare's own endpoint reports warp=on only once traffic really
          # egresses through the tunnel, which `warp-cli status` alone does not
          # establish.
          for _ in $(seq 30); do
            if warp-cli --accept-tos status | grep -q "Connected" \
              && curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -q "^warp=on$"; then
              echo "WARP connected and carrying traffic."
              exit 0
            fi
            sleep 2
          done

          warp-cli --accept-tos status || true
          echo "::error::WARP never carried traffic; Garmin would see a datacenter IP."
          exit 1

      # Dispatch inputs arrive through `env:`, never interpolated into `run:`:
      # Actions substitutes those textually, before bash parses the line.
      - name: Run sync
        id: sync
        env:
          GARMIN_SECRET: ${{ secrets.GARMIN_SECRET }}
          GARMIN_OAUTH_CONSUMER_KEY: ${{ vars.GARMIN_OAUTH_CONSUMER_KEY }}
          GARMIN_OAUTH_CONSUMER_SECRET: ${{ vars.GARMIN_OAUTH_CONSUMER_SECRET }}
          PRIVACY_ZONES: ${{ secrets.PRIVACY_ZONES }}
          PRIVACY_RADIUS_M: ${{ secrets.PRIVACY_RADIUS_M }}
          PRIVACY_SALT: ${{ secrets.PRIVACY_SALT }}
          SYNC_LIMIT: ${{ inputs.limit }}
          SYNC_DRY_RUN: ${{ inputs.dry_run }}
          SYNC_FORCE: ${{ inputs.force }}
        run: |
          set -eo pipefail
          ARGS=()
          if [ -n "${SYNC_LIMIT:-}" ]; then
            case "$SYNC_LIMIT" in
              *[!0-9]*)
                echo "::error::limit must be a whole number (got '$SYNC_LIMIT')."
                exit 1
                ;;
            esac
            ARGS+=(--limit "$SYNC_LIMIT")
          fi
          if [ "${SYNC_DRY_RUN:-}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${SYNC_FORCE:-}" = "true" ]; then
            ARGS+=(--force)
          fi

          # Exit 3 is "some activities or steps failed, everything else is on
          # disk". Failing the step here would skip the commit below and
          # discard it.
          set +e
          python scripts/sync.py "${ARGS[@]}"
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 3 ]; then
            echo "partial_failure=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Some activities or steps failed to sync. Committing what succeeded."
          elif [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

      - name: Disconnect Cloudflare WARP
        if: always()
        run: warp-cli --accept-tos disconnect || true

      - name: Backfill missing weather
        if: inputs.dry_run != true
        continue-on-error: true
        run: python scripts/backfill_weather.py

      # sync.py crops only what it writes. This brings routes stored under an
      # older rule, or an older PRIVACY_* configuration, up to the current one;
      # it is deterministic and idempotent, so after the first run it changes
      # nothing.
      - name: Re-crop stored routes to the privacy zone
        if: inputs.dry_run != true
        env:
          PRIVACY_ZONES: ${{ secrets.PRIVACY_ZONES }}
          PRIVACY_RADIUS_M: ${{ secrets.PRIVACY_RADIUS_M }}
          PRIVACY_SALT: ${{ secrets.PRIVACY_SALT }}
        run: python scripts/migrate_privacy_zone.py

      # Last gate before anything is published: measures every stored point
      # against the zones as configured, independently of the cropping code.
      # A failure here skips the commit, the deploy and the checks below.
      - name: Verify no route comes near a privacy zone
        env:
          PRIVACY_ZONES: ${{ secrets.PRIVACY_ZONES }}
          PRIVACY_RADIUS_M: ${{ secrets.PRIVACY_RADIUS_M }}
        run: python scripts/verify_privacy_zone.py

      - name: Commit updated data
        id: commit
        env:
          RUNOMICS_DATA_REPO_URL: ${{ secrets.RUNOMICS_DATA_REPO_URL }}
          RUNOMICS_DATA_REPO_TOKEN: ${{ secrets.RUNOMICS_DATA_REPO_TOKEN }}
        run: |
          # The deployment marker the post-sync step waits for - sync.py always
          # rewrites this file, so it is read from the workspace, not the push.
          python -c "import json; print('last_synced_at=' + json.load(open('data/sync_meta.json'))['lastSyncedAt'])" >> "$GITHUB_OUTPUT"

          # A refusal here means the data repository was committed to while this
          # run was syncing (see docs/personal-deployments.md > Concurrent
          # writes). Failing is the point: the next run starts from fresh data.
          if ! OUTPUT=$(node scripts/push_private_data.mjs data); then
            echo "::error::Refused to push: the private data repository changed during this run. Re-run the sync to start from fresh data."
            exit 1
          fi
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q "No data changes"; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "committed=true" >> "$GITHUB_OUTPUT"
            # A commit carrying only a new timestamp has nothing for the
            # post-sync checks to look at.
            if echo "$OUTPUT" | grep -q "refresh last-synced timestamp"; then
              echo "data_changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "data_changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Trigger Vercel redeploy
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Trigger post-sync checks
        if: steps.commit.outputs.data_changed == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
          EXPECTED_SYNC: ${{ steps.commit.outputs.last_synced_at }}
        run: |
          # Everything these endpoints read comes off the build's own filesystem,
          # so they answer for whatever deployment is live - and the previous one
          # answers 200 within a second of the push above, while Vercel is still
          # building this one. Waiting on a bare 200 therefore ran every check
          # against the data as it was *before* this sync: the insight generator
          # saw no new activity, reported "outstanding: 0", and the run it had
          # just synced had to wait for the next night to get its verdict.
          #
          # Wait for the deployment carrying this run's own sync timestamp.
          DEPLOYED=false
          for i in $(seq 1 24); do
            LIVE=$(printf 'x-internal-secret: %s\n' "$SECRET" \
              | curl -fsS --max-time 20 "$APP_URL/api/internal/health" -H @- \
              | python -c "import json,sys; print(json.load(sys.stdin).get('lastSyncedAt') or '')" 2>/dev/null || true)
            if [ -n "$EXPECTED_SYNC" ] && [ "$LIVE" = "$EXPECTED_SYNC" ]; then
              DEPLOYED=true
              echo "Deployment carrying $EXPECTED_SYNC is live after $(((i - 1) * 15))s."
              break
            fi
            sleep 15
          done
          if [ "$DEPLOYED" != "true" ]; then
            echo "::warning::App still serving pre-sync data after 6 min (live: ${LIVE:-none}, expected: $EXPECTED_SYNC). Running the checks anyway."
          fi

          # The checks below need Firebase Admin (Firestore and every push) and
          # Gemini. Name what this deployment lacks, rather than leave a row of 500s
          # to be read backwards. Health reports names only, never values.
          MISSING=$(printf 'x-internal-secret: %s\n' "$SECRET" \
            | curl -fsS --max-time 20 "$APP_URL/api/internal/health" -H @- \
            | python -c "import json,sys; i=json.load(sys.stdin).get('integrations') or {}; print(' '.join(k for k in ('firebaseAdmin', 'gemini') if i.get(k) is False))" 2>/dev/null || true)
          if [ -n "$MISSING" ]; then
            echo "::warning::This deployment has no credentials for: $MISSING. See docs/personal-deployments.md."
          fi

          # No check may take another one down with it. They are independent, and
          # a 504 on one of these used to abort the step under `bash -e` - which
          # is how a slow ai-insights pass silently cancelled the two passes
          # queued behind it. Every endpoint here is idempotent: what a failed
          # call leaves undone, the next run picks up.
          # The secret goes to curl on stdin (-H @-), never in its argv.
          check() {
            printf 'x-internal-secret: %s\n' "$SECRET" \
              | curl -fsS --max-time "${2:-90}" -X POST "$APP_URL/api/internal/$1" -H @- \
              || echo "::warning::$1 failed"
            echo
          }

          check pr-check
          check shoe-wear-check
          check overreaching-check
          check activity-sync-check

          # Each pass regenerates a surface only if its facts moved (a Firestore
          # read, no spend) and backfills another batch of run verdicts, without
          # any single request outliving the serverless function budget (300s,
          # Hobby + Fluid Compute - see maxDuration in the route). curl gets more
          # rope than that ceiling, or the connection closes before the function
          # does and the response - and its "no time left" diagnostics - never
          # comes back.
          #
          # Five passes rather than one: a single 503 (Google-side capacity) or a
          # slow model still costs a pass without progress, and a big run-verdict
          # backfill can span more than one pass on its own. A pass where
          # everything is already current costs a handful of reads.
          for i in 1 2 3 4 5; do
            check ai-insights 310
          done

      # Last, so a partial sync still reaches the data repository first.
      - name: Report a partial sync
        if: always() && steps.sync.outputs.partial_failure == 'true'
        run: |
          echo "::error::sync.py reported failed activities or steps. Whatever synced successfully was committed and deployed; see the 'Run sync' log for what failed."
          exit 1

      # A failed run used to be a red cross in an Actions tab nobody opens -
      # two reminders failed every day for over a week that way. Best effort:
      # if the app itself is what broke, this fails too, and the run is red
      # either way.
      - name: Push the failure to the owner's devices
        if: failure()
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg w "$WORKFLOW" --arg u "$RUN_URL" '{workflow: $w, runUrl: $u}' > "$RUNNER_TEMP/workflow-failure.json"
          printf 'x-internal-secret: %s\ncontent-type: application/json\n' "$SECRET" \
            | curl -fsS --max-time 20 -X POST "$APP_URL/api/internal/workflow-failure" -H @- \
                --data @"$RUNNER_TEMP/workflow-failure.json"
