name: Sync Garmin Activities

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new activities to sync (leave empty for all)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (fetch but don't write)"
        type: boolean
        default: false
      force:
        description: "Re-sync all activities (rebuilds every record)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore FIT cache
        uses: actions/cache@v5
        with:
          path: public/fit
          key: fit-${{ hashFiles('public/data/activities/**') }}
          restore-keys: |
            fit-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

      - name: Connect Cloudflare WARP
        run: |
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 3
          warp-cli --accept-tos status

      - name: Run sync
        env:
          GARMIN_SECRET: ${{ secrets.GARMIN_SECRET }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python scripts/sync.py $ARGS

      - name: Disconnect Cloudflare WARP
        if: always()
        run: warp-cli --accept-tos disconnect || true

      - name: Commit updated activities.json
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/activities/ public/data/planned_workouts.json public/data/upcoming_races.json public/data/athlete.json

          if git diff --cached --quiet; then
            ACTIVITIES_CHANGED=false
          else
            ACTIVITIES_CHANGED=true
          fi
          echo "activities_changed=$ACTIVITIES_CHANGED" >> "$GITHUB_OUTPUT"

          git add public/data/sync_meta.json

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            if [ "$ACTIVITIES_CHANGED" = "true" ]; then
              ACTIVITY_COUNT=$(python - <<'EOF'
          import json, pathlib
          total = 0
          for path in pathlib.Path("public/data/activities").glob("*.json"):
              if path.name == "index.json":
                  continue
              total += len(json.loads(path.read_text()).get("activities", []))
          print(total)
          EOF
          )
              git commit -m "sync: update activities (${ACTIVITY_COUNT} total) [skip ci]"
            else
              git commit -m "sync: refresh last-synced timestamp [skip ci]"
            fi
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger post-sync checks
        if: steps.commit.outputs.activities_changed == 'true'
        run: |
          # Poll until the app responds before checking for new PRs (Vercel needs time to redeploy).
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "${{ secrets.APP_URL }}/"; then
              break
            fi
            sleep 15
          done

          curl -fsS -X POST "${{ secrets.APP_URL }}/api/internal/pr-check" \
            -H "x-internal-secret: ${{ secrets.INTERNAL_NOTIFY_SECRET }}"
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/internal/shoe-wear-check" \
            -H "x-internal-secret: ${{ secrets.INTERNAL_NOTIFY_SECRET }}"
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/internal/overreaching-check" \
            -H "x-internal-secret: ${{ secrets.INTERNAL_NOTIFY_SECRET }}"
