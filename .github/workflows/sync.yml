name: Sync Garmin Activities

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new activities to sync (leave empty for all)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (fetch but don't write)"
        type: boolean
        default: false
      force:
        description: "Re-sync all activities (rebuilds every record)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore FIT cache
        uses: actions/cache@v5
        with:
          path: public/fit
          key: fit-${{ hashFiles('public/data/activities/**') }}
          restore-keys: |
            fit-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

      - name: Connect Cloudflare WARP
        run: |
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 3
          warp-cli --accept-tos status

      - name: Run sync
        env:
          GARMIN_SECRET: ${{ secrets.GARMIN_SECRET }}
          PRIVACY_ZONES: ${{ secrets.PRIVACY_ZONES }}
          PRIVACY_RADIUS_M: ${{ secrets.PRIVACY_RADIUS_M }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python scripts/sync.py $ARGS

      - name: Disconnect Cloudflare WARP
        if: always()
        run: warp-cli --accept-tos disconnect || true

      # Picks up any run whose conditions lookup failed during the sync itself.
      # A no-op once every activity has weather, and never worth failing a sync for.
      - name: Backfill missing weather
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: python scripts/backfill_weather.py

      - name: Commit updated activities.json
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/activities/ public/data/planned_workouts/ public/data/upcoming_races.json public/data/athlete.json

          if git diff --cached --quiet; then
            ACTIVITIES_CHANGED=false
          else
            ACTIVITIES_CHANGED=true
          fi
          echo "activities_changed=$ACTIVITIES_CHANGED" >> "$GITHUB_OUTPUT"

          # Garmin-derived metric series. sync.py re-fetches these every run and
          # Garmin revises the recent days as new activities land, so they change
          # without a new activity landing. Staged separately from the activities
          # above so the commit message can tell the two apart. Without this the
          # files were regenerated each run but never committed, leaving the app
          # stuck on whatever was last committed by hand.
          git add \
            public/data/race_predictions.json \
            public/data/vo2max_history.json \
            public/data/vo2max_norms.json \
            public/data/threshold_history.json \
            public/data/training_status.json \
            public/data/training_load_balance.json \
            public/data/training_plan.json \
            public/data/athlete_history.json

          # Anything the app renders, activities or metrics. The post-sync checks
          # hang off this rather than off activities alone: today's insight is
          # built from training_status.json, so a day where the status moved
          # without a run landing used to leave it stale until the next activity.
          if git diff --cached --quiet; then
            DATA_CHANGED=false
          else
            DATA_CHANGED=true
          fi
          echo "data_changed=$DATA_CHANGED" >> "$GITHUB_OUTPUT"

          # Last, so it never counts as a data change of its own: sync.py rewrites
          # it every run, and a commit carrying only a new timestamp has nothing
          # for the checks to look at.
          git add public/data/sync_meta.json

          # The deployment marker the post-sync step waits for. Unique per run,
          # and part of every commit this step makes.
          python -c "import json; print('last_synced_at=' + json.load(open('public/data/sync_meta.json'))['lastSyncedAt'])" >> "$GITHUB_OUTPUT"

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            if [ "$ACTIVITIES_CHANGED" = "true" ]; then
              ACTIVITY_COUNT=$(python - <<'EOF'
          import json, pathlib
          total = 0
          for path in pathlib.Path("public/data/activities").glob("*.json"):
              if path.name == "index.json":
                  continue
              total += len(json.loads(path.read_text()).get("activities", []))
          print(total)
          EOF
          )
              git commit -m "sync: update activities (${ACTIVITY_COUNT} total) [skip ci]"
            elif [ "$DATA_CHANGED" = "true" ]; then
              git commit -m "sync: refresh Garmin metrics and timestamp [skip ci]"
            else
              git commit -m "sync: refresh last-synced timestamp [skip ci]"
            fi
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger post-sync checks
        if: steps.commit.outputs.data_changed == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
          EXPECTED_SYNC: ${{ steps.commit.outputs.last_synced_at }}
        run: |
          # Everything these endpoints read comes off the build's own filesystem,
          # so they answer for whatever deployment is live - and the previous one
          # answers 200 within a second of the push above, while Vercel is still
          # building this one. Waiting on a bare 200 therefore ran every check
          # against the data as it was *before* this sync: the insight generator
          # saw no new activity, reported "outstanding: 0", and the run it had
          # just synced had to wait for the next night to get its verdict.
          #
          # Wait for the deployment carrying this run's own sync timestamp.
          DEPLOYED=false
          for i in $(seq 1 24); do
            LIVE=$(curl -fsS --max-time 20 "$APP_URL/api/internal/health" -H "x-internal-secret: $SECRET" \
              | python -c "import json,sys; print(json.load(sys.stdin).get('lastSyncedAt') or '')" 2>/dev/null || true)
            if [ -n "$EXPECTED_SYNC" ] && [ "$LIVE" = "$EXPECTED_SYNC" ]; then
              DEPLOYED=true
              echo "Deployment carrying $EXPECTED_SYNC is live after $(((i - 1) * 15))s."
              break
            fi
            sleep 15
          done
          if [ "$DEPLOYED" != "true" ]; then
            echo "::warning::App still serving pre-sync data after 6 min (live: ${LIVE:-none}, expected: $EXPECTED_SYNC). Running the checks anyway."
          fi

          # No check may take another one down with it. They are independent, and
          # a 504 on one of these used to abort the step under `bash -e` - which
          # is how a slow ai-insights pass silently cancelled the two passes
          # queued behind it. Every endpoint here is idempotent: what a failed
          # call leaves undone, the next run picks up.
          check() {
            curl -fsS --max-time "${2:-90}" -X POST "$APP_URL/api/internal/$1" -H "x-internal-secret: $SECRET" \
              || echo "::warning::$1 failed"
            echo
          }

          check pr-check
          check shoe-wear-check
          check overreaching-check
          check activity-sync-check

          # Each pass regenerates a surface only if its facts moved (a Firestore
          # read, no spend) and backfills another batch of run verdicts, without
          # any single request outliving the serverless function budget (300s,
          # Hobby + Fluid Compute - see maxDuration in the route). curl gets more
          # rope than that ceiling, or the connection closes before the function
          # does and the response - and its "no time left" diagnostics - never
          # comes back.
          #
          # Five passes rather than one: a single 503 (Google-side capacity) or a
          # slow model still costs a pass without progress, and a big run-verdict
          # backfill can span more than one pass on its own. A pass where
          # everything is already current costs a handful of reads.
          for i in 1 2 3 4 5; do
            check ai-insights 310
          done
