name: Sync Garmin Activities
# The app's Sync button reads the trailing (profile) back to tell which profile a run syncs (src/lib/syncLimits.ts).
run-name: ${{ inputs.nightly && 'Nightly sync' || inputs.quick && 'Quick sync' || 'Sync' }} Garmin Activities (${{ inputs.profile || 'all' }})

# Each deployment's Vercel Cron dispatches its nightly run (/api/internal/nightly-sync): GitHub's cron lands hours late.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new activities to sync (leave empty for all)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (fetch but don't write)"
        type: boolean
        default: false
      force:
        description: "Re-sync all activities (rebuilds every record)"
        type: boolean
        default: false
      reprocess:
        description: "Rebuild stored runs from their cached FIT files with the current parser (no Garmin calls)"
        type: boolean
        default: false
      profile:
        description: "Which deployment to sync"
        type: choice
        options: [all, adam, lamiaa]
        default: all
      quick:
        description: "Quick: only the new runs, through the Personal API key (no WARP, no Garmin Connect)"
        type: boolean
        default: false
      nightly:
        description: "Nightly: a full sync that also warns before a token expires"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # A manual dispatch can target one profile: its options only ever make sense for one dataset.
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          REQUESTED: ${{ inputs.profile }}
        run: |
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "all" ]; then
            echo 'matrix=["adam","lamiaa"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[\"$REQUESTED\"]" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: profiles
    runs-on: ubuntu-latest
    # A hung WARP connect or Garmin call would otherwise hold a runner for the default six hours.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    strategy:
      # One profile's Garmin login expiring must not cancel everyone else's sync.
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.profiles.outputs.matrix) }}

    # Per-profile secrets live in a GitHub Environment of the same name.
    environment: ${{ matrix.profile }}

    # Runs for one profile take turns and never cancel the one waiting: all push to its data repository.
    concurrency:
      group: sync-${{ matrix.profile }}
      cancel-in-progress: false
      queue: max

    env:
      RUNOMICS_DATA_DIR: data

    steps:
      # Third-party code (garth, pip packages) runs in this job; the sync pushes with the data repository's own token.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Naming an environment does not hide repository-level secrets, so a half-configured profile would
      # sync someone else's Garmin account; a PROFILE variable matching the environment's name proves it is set up.
      - name: Check the sync configuration
        id: config
        env:
          DECLARED_PROFILE: ${{ vars.PROFILE }}
          RUNOMICS_DATA_REPO_URL: ${{ secrets.RUNOMICS_DATA_REPO_URL }}
          RUNOMICS_DATA_REPO_TOKEN: ${{ secrets.RUNOMICS_DATA_REPO_TOKEN }}
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          GARMIN_SECRET: ${{ secrets.GARMIN_SECRET }}
          QUICK: ${{ inputs.quick }}
        run: |
          if [ "$DECLARED_PROFILE" != "${{ matrix.profile }}" ]; then
            echo "::error::Environment '${{ matrix.profile }}' does not declare PROFILE=${{ matrix.profile }} (got '${DECLARED_PROFILE:-unset}')."
            echo "Its secrets are unset or inherited from the repository, which would sync"
            echo "the wrong athlete."
            exit 1
          fi

          MISSING=""
          [ -n "$RUNOMICS_DATA_REPO_URL" ]   || MISSING="$MISSING RUNOMICS_DATA_REPO_URL"
          [ -n "$RUNOMICS_DATA_REPO_TOKEN" ] || MISSING="$MISSING RUNOMICS_DATA_REPO_TOKEN"
          # Either reads the runs; the key is the one that can be renewed.
          [ -n "$GARMIN_PERSONAL_API_KEY$GARMIN_SECRET" ] || MISSING="$MISSING GARMIN_PERSONAL_API_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Environment '${{ matrix.profile }}' is missing secret(s):$MISSING"
            echo "Every profile syncs into its own private data repository and never"
            echo "commits anything back here."
            exit 1
          fi
          if [ -z "$GARMIN_PERSONAL_API_KEY" ]; then
            echo "::warning::Environment '${{ matrix.profile }}' has no GARMIN_PERSONAL_API_KEY: every run is read through garth, whose token cannot be renewed."
            echo "personal_api=false" >> "$GITHUB_OUTPUT"
          else
            echo "personal_api=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$QUICK" != "true" ]; then
            echo "quick=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$GARMIN_PERSONAL_API_KEY" ]; then
            echo "quick=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::A quick sync needs GARMIN_PERSONAL_API_KEY: this one runs as a full sync."
            echo "quick=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Fetch current private data
        env:
          RUNOMICS_DATA_REPO_URL: ${{ secrets.RUNOMICS_DATA_REPO_URL }}
          RUNOMICS_DATA_REPO_TOKEN: ${{ secrets.RUNOMICS_DATA_REPO_TOKEN }}
        run: node scripts/fetch_private_data.mjs data

      # Saved by the step after the sync, keyed by the files it holds: a key known before the sync skipped the save.
      - name: Restore FIT cache
        id: fitcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fit-cache
          key: fit-cache-${{ matrix.profile }}-${{ github.run_id }}
          restore-keys: |
            fit-cache-${{ matrix.profile }}-

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      # Hash-locked: this job holds GARMIN_SECRET and the data repository's write token.
      - name: Install Python dependencies
        run: pip install --require-hashes -r scripts/requirements.txt

      - name: Name the ISO week
        id: week
        if: steps.config.outputs.quick != 'true'
        run: echo "iso=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # WARP's ~120 MB of .debs come from a mirror that can crawl. Saved once a week, not each night: a save is 117 MB.
      - name: Restore WARP packages
        if: steps.config.outputs.quick != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/warp-apt
          key: warp-apt-${{ runner.os }}-${{ steps.week.outputs.iso }}
          restore-keys: warp-apt-${{ runner.os }}-

      # Only garth needs WARP: with a Personal API key the runs still sync without it, so a
      # failed install or connect is a partial night (no gear, calendar or Connect metrics).
      - name: Install Cloudflare WARP
        id: warp_install
        if: steps.config.outputs.quick != 'true'
        timeout-minutes: 10
        continue-on-error: ${{ steps.config.outputs.personal_api == 'true' }}
        run: |
          set -euo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          mkdir -p ~/.cache/warp-apt/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Dir::Cache::Archives="$HOME/.cache/warp-apt" cloudflare-warp
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/warp-apt
          # Recorded, not pinned: the repository keeps only current versions, so
          # a pin breaks the sync the day Cloudflare publishes the next one. The
          # log is what makes "which build started failing" answerable later.
          echo "cloudflare-warp $(dpkg-query -W -f='${Version}' cloudflare-warp)"

      # Connect's private API refuses GitHub's datacenter ranges, so garth only reaches it through WARP.
      - name: Connect Cloudflare WARP
        id: warp
        if: steps.warp_install.outcome == 'success'
        timeout-minutes: 5
        continue-on-error: ${{ steps.config.outputs.personal_api == 'true' }}
        run: |
          set -euo pipefail

          registered=false
          for attempt in 1 2 3; do
            if warp-cli --accept-tos registration new; then
              registered=true
              break
            fi
            echo "::warning::WARP registration attempt ${attempt} failed; retrying."
            sleep $((attempt * 10))
          done
          if [ "$registered" != true ]; then
            echo "::error::WARP registration failed three times."
            exit 1
          fi

          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect

          # Cloudflare's own endpoint reports warp=on only once traffic really
          # egresses through the tunnel, which `warp-cli status` alone does not
          # establish.
          for _ in $(seq 30); do
            if warp-cli --accept-tos status | grep -q "Connected" \
              && curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -q "^warp=on$"; then
              echo "WARP connected and carrying traffic."
              exit 0
            fi
            sleep 2
          done

          warp-cli --accept-tos status || true
          echo "::error::WARP never carried traffic; Garmin would see a datacenter IP."
          exit 1

      - name: Note WARP unavailable
        if: steps.config.outputs.quick != 'true' && steps.warp.outcome != 'success'
        run: echo "::warning::WARP is unavailable, so runs come through the Personal API alone; garth (gear, calendar, Connect metrics) will likely fail from GitHub's network and the night counts as partial."

      # Dispatch inputs arrive through `env:`, never interpolated into `run:`:
      # Actions substitutes those textually, before bash parses the line.
      - name: Run sync
        id: sync
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          GARMIN_SECRET: ${{ secrets.GARMIN_SECRET }}
          GARMIN_OAUTH_CONSUMER_KEY: ${{ vars.GARMIN_OAUTH_CONSUMER_KEY }}
          GARMIN_OAUTH_CONSUMER_SECRET: ${{ vars.GARMIN_OAUTH_CONSUMER_SECRET }}
          SYNC_LIMIT: ${{ inputs.limit }}
          SYNC_DRY_RUN: ${{ inputs.dry_run }}
          SYNC_FORCE: ${{ inputs.force }}
          SYNC_QUICK: ${{ steps.config.outputs.quick }}
        run: |
          set -eo pipefail
          ARGS=()
          if [ -n "${SYNC_LIMIT:-}" ]; then
            case "$SYNC_LIMIT" in
              *[!0-9]*)
                echo "::error::limit must be a whole number (got '$SYNC_LIMIT')."
                exit 1
                ;;
            esac
            ARGS+=(--limit "$SYNC_LIMIT")
          fi
          if [ "${SYNC_DRY_RUN:-}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${SYNC_FORCE:-}" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ "${SYNC_QUICK:-}" = "true" ]; then
            ARGS+=(--quick)
          fi

          connect_state() { jq -r '.state // ""' data/connect_status.json 2>/dev/null || true; }
          CONNECT_BEFORE=$(connect_state)

          # Exit 3 is "some activities or steps failed, everything else is on
          # disk". Failing the step here would skip the commit below and
          # discard it.
          set +e
          python scripts/sync.py "${ARGS[@]}"
          STATUS=$?
          set -e

          # sync.py records garth's token death in connect_status.json: the operator is told once, the night it turns.
          if [ "$(connect_state)" = "expired" ]; then
            echo "connect_expired=true" >> "$GITHUB_OUTPUT"
            if [ "$CONNECT_BEFORE" != "expired" ]; then
              echo "connect_newly_expired=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          if [ "$STATUS" -eq 3 ]; then
            echo "partial_failure=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Some activities or steps failed to sync. Committing what succeeded."
          elif [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

      # Through WARP, like every garth call; a failure keeps the stored shoe list and counts the night as partial.
      - name: Sync shoes
        id: shoes
        if: steps.config.outputs.quick != 'true' && inputs.dry_run != true && steps.warp.outcome == 'success' && steps.sync.outputs.connect_expired != 'true'
        env:
          GARMIN_SECRET: ${{ secrets.GARMIN_SECRET }}
          GARMIN_OAUTH_CONSUMER_KEY: ${{ vars.GARMIN_OAUTH_CONSUMER_KEY }}
          GARMIN_OAUTH_CONSUMER_SECRET: ${{ vars.GARMIN_OAUTH_CONSUMER_SECRET }}
        run: |
          if [ -z "$GARMIN_SECRET" ]; then
            echo "No GARMIN_SECRET in this environment: the shoe list stays as stored."
            exit 0
          fi
          if ! python scripts/sync_shoes.py > /dev/null; then
            echo "partial_failure=true" >> "$GITHUB_OUTPUT"
            echo "::warning::The shoe list could not be read from Garmin Connect; the stored one is kept."
          fi

      - name: Disconnect Cloudflare WARP
        if: always() && steps.warp_install.outcome == 'success'
        run: warp-cli --accept-tos disconnect || true

      # Rebuilds stored runs from the FIT files cached above, asking Garmin for nothing.
      - name: Reprocess cached runs
        if: inputs.reprocess == true && inputs.dry_run != true && steps.config.outputs.quick != 'true'
        run: python scripts/reprocess.py

      # A quick sync's new FIT file is kept too: the key changes whenever the set of files does.
      - name: Name the FIT cache by its files
        id: fitkey
        if: always() && inputs.dry_run != true
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          if [ -d .fit-cache ] && [ -n "$(ls -A .fit-cache)" ]; then
            echo "key=fit-cache-${PROFILE}-$(ls .fit-cache | LC_ALL=C sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi

      - name: Save FIT cache
        if: always() && steps.fitkey.outputs.key != '' && steps.fitkey.outputs.key != steps.fitcache.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fit-cache
          key: ${{ steps.fitkey.outputs.key }}

      - name: Backfill missing weather
        if: inputs.dry_run != true
        continue-on-error: true
        run: python scripts/backfill_weather.py

      # Notes and tags exist only in Firestore otherwise; the coach reads this copy. The log gets a count, never a note.
      - name: Back up run notes
        if: inputs.dry_run != true
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
        run: |
          set -euo pipefail
          printf 'x-internal-secret: %s\n' "$SECRET" \
            | curl -fsS --max-time 30 "$APP_URL/api/internal/activity-notes" -H @- \
            | jq -S --indent 2 '.' > "$RUNNER_TEMP/activity_notes.json"
          jq -e '.notes | type == "object"' "$RUNNER_TEMP/activity_notes.json" > /dev/null
          mv "$RUNNER_TEMP/activity_notes.json" data/activity_notes.json
          echo "Backed up the notes of $(jq '.notes | length' data/activity_notes.json) run(s)."

      # Health data that exists only in Firestore otherwise; the coach falls back to this copy. The log gets a count only.
      - name: Back up wellness check-ins
        if: inputs.dry_run != true
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
        run: |
          set -euo pipefail
          printf 'x-internal-secret: %s\n' "$SECRET" \
            | curl -fsS --max-time 30 "$APP_URL/api/internal/wellness" -H @- \
            | jq -S --indent 2 '.' > "$RUNNER_TEMP/wellness.json"
          jq -e '.entries | type == "object"' "$RUNNER_TEMP/wellness.json" > /dev/null
          mv "$RUNNER_TEMP/wellness.json" data/wellness.json
          echo "Backed up $(jq '.entries | length' data/wellness.json) check-in(s)."

      - name: Commit updated data
        id: commit
        env:
          RUNOMICS_DATA_REPO_URL: ${{ secrets.RUNOMICS_DATA_REPO_URL }}
          RUNOMICS_DATA_REPO_TOKEN: ${{ secrets.RUNOMICS_DATA_REPO_TOKEN }}
        run: |
          # The deployment marker the post-sync step waits for - sync.py always
          # rewrites this file, so it is read from the workspace, not the push.
          python -c "import json; print('last_synced_at=' + json.load(open('data/sync_meta.json'))['lastSyncedAt'])" >> "$GITHUB_OUTPUT"

          # A refusal here means the data repository was committed to while this
          # run was syncing. Failing is the point: the next run starts from fresh
          # data.
          if ! OUTPUT=$(node scripts/push_private_data.mjs data); then
            echo "::error::Refused to push: the private data repository changed during this run. Re-run the sync to start from fresh data."
            exit 1
          fi
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q "No data changes"; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "committed=true" >> "$GITHUB_OUTPUT"
            # A commit carrying only a new timestamp has nothing new for the
            # post-sync checks to look at - only the AI work an earlier sync
            # left unfinished, which the step below retries.
            if echo "$OUTPUT" | grep -q "refresh last-synced timestamp"; then
              echo "data_changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "data_changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Once the expiry is committed, so the next night reads it and stays quiet: one push, best effort.
      - name: Tell the operator Garmin Connect has stopped
        if: steps.sync.outputs.connect_newly_expired == 'true' && steps.commit.outcome == 'success'
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
        run: |
          jq '{since}' data/connect_status.json > "$RUNNER_TEMP/connect-expired.json"
          printf 'x-internal-secret: %s\ncontent-type: application/json\n' "$SECRET" \
            | curl -fsS --max-time 30 -X POST "$APP_URL/api/internal/connect-expired" -H @- --data @"$RUNNER_TEMP/connect-expired.json"
          echo "::warning::garth's token has expired: Garmin Connect is off until a new one is minted. See 'After garth' in docs/data-and-sync.md."

      # Both deployments read the data repository at run time: no rebuild, only their cached commit expired.
      - name: Expire the app's data cache
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
        run: |
          printf 'x-internal-secret: %s\n' "$SECRET" | curl -fsS --max-time 20 -X POST "$APP_URL/api/internal/data-revalidate" -H @-
          date +%s > "$RUNNER_TEMP/deploy_hook_at"

      # Also after a timestamp-only commit, to retry the AI work an earlier sync left unfinished.
      - name: Trigger post-sync checks
        if: steps.commit.outputs.committed == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
          EXPECTED_SYNC: ${{ steps.commit.outputs.last_synced_at }}
          DATA_CHANGED: ${{ steps.commit.outputs.data_changed }}
        run: |
          # The checks read what the app serves: before it serves this sync, they would judge the data before it.
          INTERVAL=3
          DEPLOYED=false
          for i in $(seq 1 $((360 / INTERVAL))); do
            HEALTH=$(printf 'x-internal-secret: %s\n' "$SECRET" | curl -sS --max-time 20 "$APP_URL/api/internal/health" -H @- || true)
            LIVE=$(printf '%s' "$HEALTH" | python -c "import json,sys; print(json.load(sys.stdin).get('lastSyncedAt') or '')" 2>/dev/null || true)
            REFUSED=$(printf '%s' "$HEALTH" | python -c "import json,sys; r=json.load(sys.stdin).get('rejectedData'); print(r['commit'] + ': ' + '; '.join(r['errors'][:3]) if r else '')" 2>/dev/null || true)
            if [ -n "$REFUSED" ]; then
              echo "::error::The app refused the data repository's commit $REFUSED"
              exit 1
            fi
            if [ -n "$EXPECTED_SYNC" ] && [ "$LIVE" = "$EXPECTED_SYNC" ]; then
              DEPLOYED=true
              date +%s > "$RUNNER_TEMP/live_at"
              echo "The app serves $EXPECTED_SYNC after $(((i - 1) * INTERVAL))s."
              break
            fi
            sleep "$INTERVAL"
          done
          if [ "$DEPLOYED" != "true" ]; then
            echo "::warning::App still serving pre-sync data after 6 min (live: ${LIVE:-none}, expected: $EXPECTED_SYNC). Running the checks anyway."
          else
            # Again, for a page whose render began before the first ping and ended after it, with the old commit.
            printf 'x-internal-secret: %s\n' "$SECRET" | curl -fsS --max-time 20 -X POST "$APP_URL/api/internal/data-revalidate" -H @- || true
            echo
          fi

          # The checks below need Firebase Admin (Firestore and every push) and
          # Gemini. Name what this deployment lacks, rather than leave a row of 500s
          # to be read backwards. Health reports names only, never values.
          MISSING=$(printf 'x-internal-secret: %s\n' "$SECRET" \
            | curl -fsS --max-time 20 "$APP_URL/api/internal/health" -H @- \
            | python -c "import json,sys; i=json.load(sys.stdin).get('integrations') or {}; print(' '.join(k for k in ('firebaseAdmin', 'gemini') if i.get(k) is False))" 2>/dev/null || true)
          if [ -n "$MISSING" ]; then
            echo "::warning::This deployment has no credentials for: $MISSING."
          fi
          # Routes are stored as recorded, start and finish included: on a public
          # site, anyone sees where every run begins.
          PUBLIC=$(printf 'x-internal-secret: %s\n' "$SECRET" \
            | curl -fsS --max-time 20 "$APP_URL/api/internal/health" -H @- \
            | python -c "import json,sys; print('yes' if (json.load(sys.stdin).get('integrations') or {}).get('privateSite') is False else '')" 2>/dev/null || true)
          if [ -n "$PUBLIC" ]; then
            echo "::warning::This deployment is public and serves every route in full, start and finish included. Set RUNOMICS_PRIVATE=1."
          fi

          # No check may take another one down with it. They are independent, and
          # a 504 on one of these used to abort the step under `bash -e` - which
          # is how a slow ai-insights pass silently cancelled the two passes
          # queued behind it. Every endpoint here is idempotent: what a failed
          # call leaves undone, the next run picks up.
          # The secret goes to curl on stdin (-H @-), never in its argv.
          check() {
            printf 'x-internal-secret: %s\n' "$SECRET" \
              | curl -fsS --max-time "${2:-90}" -X POST "$APP_URL/api/internal/$1" -H @- \
              || echo "::warning::$1 failed"
            echo
          }

          # New records, alerts and activities come only with new data.
          if [ "$DATA_CHANGED" = "true" ]; then
            check pr-check
            check shoe-wear-check
            check explore-check
            check overreaching-check
            check activity-sync-check
          fi
          # Errors come from the phones, with or without new data.
          check client-error-check

          # Each pass regenerates a surface only if its facts moved (a Firestore
          # read, no spend) and backfills another batch of run verdicts, without
          # any single request outliving the serverless function budget (300s,
          # Hobby + Fluid Compute - see maxDuration in the route). curl gets more
          # rope than that ceiling, or the connection closes before the function
          # does and the response - and its "no time left" diagnostics - never
          # comes back.
          #
          # Five passes rather than one: a single 503 (Google-side capacity) or a
          # slow model still costs a pass without progress, and a big run-verdict
          # backfill can span more than one pass on its own. A pass where
          # everything is already current costs a handful of reads, and once
          # one asks Gemini nothing - the day's ledger reads the same after it
          # as before - the rest would only read the same: everything is
          # current, or the budget is spent.
          LAST_SPEND=""
          for i in 1 2 3 4 5; do
            OUT=$(check ai-insights 310)
            echo "$OUT"
            if [ "$i" = 1 ]; then
              date +%s > "$RUNNER_TEMP/verdict_at"
            fi
            SPEND=$(printf '%s' "$OUT" \
              | python -c "import json,sys; print(json.dumps(json.load(sys.stdin).get('spend') or {}, sort_keys=True))" 2>/dev/null || true)
            if [ -n "$SPEND" ] && [ "$SPEND" = "$LAST_SPEND" ]; then
              echo "Pass $i asked Gemini nothing: the rest would only read the same."
              break
            fi
            LAST_SPEND=$SPEND
          done

      # Nightly only: a push each night for two weeks beats a sync that stops one morning. The app adds its own tokens.
      - name: Warn before a token expires
        if: inputs.nightly == true
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
          DATA_TOKEN: ${{ secrets.RUNOMICS_DATA_REPO_TOKEN }}
        run: |
          EXPIRY=$(printf 'Authorization: Bearer %s\n' "$DATA_TOKEN" \
            | curl -fsS --max-time 20 -o /dev/null -D - https://api.github.com/rate_limit -H @- \
            | tr -d '\r' | sed -n 's/^github-authentication-token-expiration: //Ip')
          jq -n --arg e "$EXPIRY" '{tokens: (if $e == "" then [] else [{name: "dataActions", expiresAt: $e}] end)}' > "$RUNNER_TEMP/token-expiry.json"
          printf 'x-internal-secret: %s\ncontent-type: application/json\n' "$SECRET" \
            | curl -fsS --max-time 60 -X POST "$APP_URL/api/internal/token-expiry" -H @- --data @"$RUNNER_TEMP/token-expiry.json" \
            | jq -r '.tokens[] | "- \(.name) expires \(.expiresAt)"' >> "$GITHUB_STEP_SUMMARY"

      # Last, so a partial sync still reaches the data repository first.
      - name: Report a partial sync
        if: always() && (steps.sync.outputs.partial_failure == 'true' || steps.shoes.outputs.partial_failure == 'true')
        run: |
          echo "::error::Some activities or steps failed. Whatever synced successfully was committed and deployed; see the 'Run sync' and 'Sync shoes' logs for what failed."
          exit 1

      # Best effort: if the app itself is what broke, this fails too.
      - name: Push the failure to the owner's devices
        if: failure()
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg w "$WORKFLOW" --arg u "$RUN_URL" '{workflow: $w, runUrl: $u}' > "$RUNNER_TEMP/workflow-failure.json"
          printf 'x-internal-secret: %s\ncontent-type: application/json\n' "$SECRET" \
            | curl -fsS --max-time 20 -X POST "$APP_URL/api/internal/workflow-failure" -H @- \
                --data @"$RUNNER_TEMP/workflow-failure.json"

      - name: Time the run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: sync (${{ matrix.profile }})
          MODE: ${{ steps.config.outputs.quick == 'true' && 'quick' || 'full' }}
        run: |
          api() {
            printf 'authorization: Bearer %s\n' "$GH_TOKEN" \
              | curl -fsS --max-time 20 -H @- -H 'accept: application/vnd.github+json' \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID$1"
          }
          mark() { cat "$RUNNER_TEMP/$1" 2>/dev/null || echo null; }
          api "" > "$RUNNER_TEMP/run.json"
          api "/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          jq -rn --slurpfile run "$RUNNER_TEMP/run.json" --slurpfile jobs "$RUNNER_TEMP/jobs.json" \
            --arg job "$JOB_NAME" --arg mode "$MODE" \
            --argjson hook "$(mark deploy_hook_at)" --argjson live "$(mark live_at)" --argjson verdict "$(mark verdict_at)" \
            -f scripts/sync_timing.jq >> "$GITHUB_STEP_SUMMARY"
