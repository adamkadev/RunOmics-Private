name: Internal notify

# The one job behind the three scheduled reminders. They differ only in when
# they run and which endpoint they call; everything else - and in particular the
# profile guard, which is what keeps one athlete's reminder off another
# athlete's deployment - is the same and must stay that way.
on:
  workflow_call:
    inputs:
      endpoint:
        description: "Path under /api/internal/"
        required: true
        type: string
      label:
        description: "Step name, for the run log"
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest

    strategy:
      # One deployment being unreachable must not cancel the other's reminder.
      fail-fast: false
      matrix:
        profile: [adam, lamiaa]

    # APP_URL and INTERNAL_NOTIFY_SECRET below resolve to this profile's own
    # deployment. See docs/personal-deployments.md.
    environment: ${{ matrix.profile }}

    steps:
      # Repository secrets stay visible to a job that names an environment, so an
      # unpopulated one would aim this profile's reminder at another profile's
      # deployment. The variable proves the environment is really configured.
      - name: Check the profile environment
        env:
          DECLARED_PROFILE: ${{ vars.PROFILE }}
        run: |
          if [ "$DECLARED_PROFILE" != "${{ matrix.profile }}" ]; then
            echo "::error::Environment '${{ matrix.profile }}' does not declare PROFILE=${{ matrix.profile }} (got '${DECLARED_PROFILE:-unset}'). See docs/personal-deployments.md."
            exit 1
          fi

      - name: ${{ inputs.label }} (${{ matrix.profile }})
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INTERNAL_NOTIFY_SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
          ENDPOINT: ${{ inputs.endpoint }}
        run: |
          curl -fsS -X POST "$APP_URL/api/internal/$ENDPOINT" \
            -H "x-internal-secret: $INTERNAL_NOTIFY_SECRET"
