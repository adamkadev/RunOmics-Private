name: Internal notify

# The one job behind the three scheduled reminders. They differ only in when
# they run and which endpoint they call; everything else - and in particular the
# profile guard, which is what keeps one athlete's reminder off another
# athlete's deployment - is the same and must stay that way.
on:
  workflow_call:
    inputs:
      endpoint:
        description: "Path under /api/internal/"
        required: true
        type: string
      label:
        description: "Step name, for the run log"
        required: true
        type: string
    # Passed by name rather than `secrets: inherit`, so the Garmin, data-repo
    # and deploy-hook secrets never reach this job. Not `required`: a value
    # may live only in the profile's environment, which a job that names
    # that environment reads in place of whatever the caller passed.
    secrets:
      APP_URL:
        required: false
      INTERNAL_NOTIFY_SECRET:
        required: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      # One deployment being unreachable must not cancel the other's reminder.
      fail-fast: false
      matrix:
        profile: [adam, lamiaa]

    # APP_URL and INTERNAL_NOTIFY_SECRET below resolve to this profile's own
    # deployment.
    environment: ${{ matrix.profile }}

    steps:
      # Repository secrets stay visible to a job that names an environment, so an
      # unpopulated one would aim this profile's reminder at another profile's
      # deployment. The variable proves the environment is really configured.
      - name: Check the profile environment
        env:
          DECLARED_PROFILE: ${{ vars.PROFILE }}
        run: |
          if [ "$DECLARED_PROFILE" != "${{ matrix.profile }}" ]; then
            echo "::error::Environment '${{ matrix.profile }}' does not declare PROFILE=${{ matrix.profile }} (got '${DECLARED_PROFILE:-unset}')."
            exit 1
          fi

      - name: ${{ inputs.label }} (${{ matrix.profile }})
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INTERNAL_NOTIFY_SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
          ENDPOINT: ${{ inputs.endpoint }}
        # The header is read from stdin (-H @-), so the secret never appears
        # in curl's argv, where any process on the runner could read it.
        run: |
          printf 'x-internal-secret: %s\n' "$INTERNAL_NOTIFY_SECRET" \
            | curl -fsS -X POST "$APP_URL/api/internal/$ENDPOINT" -H @-

      # A failed run used to be a red cross in an Actions tab nobody opens -
      # two reminders failed every day for over a week that way. Best effort:
      # if the app itself is what broke, this fails too, and the run is red
      # either way.
      - name: Push the failure to the owner's devices
        if: failure()
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg w "$WORKFLOW" --arg u "$RUN_URL" '{workflow: $w, runUrl: $u}' > "$RUNNER_TEMP/workflow-failure.json"
          printf 'x-internal-secret: %s\ncontent-type: application/json\n' "$SECRET" \
            | curl -fsS --max-time 20 -X POST "$APP_URL/api/internal/workflow-failure" -H @- \
                --data @"$RUNNER_TEMP/workflow-failure.json"
