name: Firestore rules

# firestore.rules is the only guard on what the public web config can reach.
on:
  pull_request:
    paths:
      - firestore.rules
      - firebase.json
      - src/infrastructure/__tests__/firestoreRules.test.ts
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:
  schedule:
    - cron: "13 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The npm cache stays here only: ~/.npm holds the firebase-tools that `npx -y` in test:rules would fetch again.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      # The Firestore emulator needs Java 21; the runner ships it, not as default.
      - name: Use the preinstalled JDK 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      # Shared with E2E under the same key: a hit skips `npm ci`.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # The emulator jar is a download of its own on every run otherwise.
      - name: Restore the Firestore emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - name: Test the Firestore rules against the emulator
        run: npm run test:rules
