name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-dev.txt

      - name: Run pytest
        run: python -m pytest scripts/tests/ -q

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Align npm version with lock file
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # High/critical advisories in prod deps fail CI; dev-only and
        # moderate advisories stay informational (npm audit for details).
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
        # Production build (next build) is intentionally not run here - it
        # prerenders Firestore-backed pages against prod Firebase Admin
        # credentials, and Vercel already runs that same build on every push.
        # Running it twice was burning through the Firestore read quota.
