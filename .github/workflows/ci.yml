name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, for the coverage figure and to re-check main against dependency drift.
  schedule:
    - cron: "13 5 * * 1"

permissions:
  contents: read

# Runs on main always finish, so every commit there keeps its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install --require-hashes -r scripts/requirements-dev.txt

      - name: Lint Python
        run: ruff check scripts

      - name: Run pytest
        run: python -m pytest scripts/tests/ -q

  # firestore.rules is the only guard on what the public web config can reach.
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The npm cache stays here only: ~/.npm holds the firebase-tools that `npx -y` in test:rules would fetch again.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      # The Firestore emulator needs Java 21; the runner ships it, not as default.
      - name: Use the preinstalled JDK 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      # Shared with E2E under the same key: a hit skips `npm ci`.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # The emulator jar is a download of its own on every run otherwise.
      - name: Restore the Firestore emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - name: Test the Firestore rules against the emulator
        run: npm run test:rules

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Shared with E2E under the same key: a hit skips `npm ci`.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # HEAD^1 is the base of a PR's merge commit; a push to main of more than one commit is audited whatever it changed.
      - name: Check whether the lock file changed
        id: lockfile
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$BEFORE" != "$(git rev-parse HEAD^1)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^1 HEAD -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # An advisory published against an untouched lock file is Dependabot's to raise, not a reason to fail this change.
      - name: Audit production dependencies
        if: steps.lockfile.outputs.changed != 'false'
        run: npm audit --omit=dev --audit-level=high

      - name: Verify no private data is committed
        run: npm run verify:private-data

      # The public repo is cloned for the files it keeps of its own; nothing is written to it.
      - name: Check the public demo export
        run: |
          git clone --quiet --depth 1 https://github.com/adamkadev/RunOmics.git "$RUNNER_TEMP/public"
          node scripts/export_public_demo.mjs --to "$RUNNER_TEMP/public" --check --strict

      # Saved from main only: a PR's own entry would serve no other branch and take room under GitHub's 10 GB.
      - name: Restore the ESLint cache
        id: eslint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'package-lock.json') }}-

      - name: Lint
        run: npm run lint

      - name: Save the ESLint cache
        if: github.ref == 'refs/heads/main' && steps.eslint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/eslint
          key: ${{ steps.eslint-cache.outputs.cache-primary-key }}

      - name: Typecheck
        run: npm run typecheck

      - name: Check import cycles
        run: npm run check:cycles

      # A report, not a gate: each finding is a lead to confirm with a whole-repo grep before deleting.
      - name: Report unused files and exports
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          npx -y knip@5.88.1 --no-progress > "$RUNNER_TEMP/knip.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/knip.txt"
          { echo '### Unused code (knip)'; echo '```'; cat "$RUNNER_TEMP/knip.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

  # E2E builds on main alone, so without this a pull request that breaks `next build` merges unbuilt.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Shared with E2E under the same key: a hit skips `npm ci`.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # E2E saves this cache from main; the paths must be E2E's, as they are part of the cache's version.
      - name: Restore the Next.js build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .next/cache
            .next-e2e-sparse/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build against the E2E data
        run: npm run e2e:build

  # Two shards beside verify, each with a worker per core: vitest's default leaves one core idle.
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request') && '[1, 2]' || '[1]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Shared with E2E under the same key: a hit skips `npm ci`.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Coverage doubles the suite's time, so only the weekly and manual runs collect it.
      - name: Test
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npm test -- --shard=${{ matrix.shard }}/2 --maxWorkers=100%

      - name: Test, with coverage
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        run: npm run test:coverage -- --maxWorkers=100% --coverage.reporter=text-summary --coverage.reporter=json-summary

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node -e '
            const { total } = require("./coverage/coverage-summary.json")
            const rows = ["lines", "statements", "functions", "branches"].map((k) => `| ${k} | ${total[k].pct}% |`)
            console.log(["| Coverage | |", "|---|---:|", ...rows].join("\n"))
          ' >> "$GITHUB_STEP_SUMMARY"
