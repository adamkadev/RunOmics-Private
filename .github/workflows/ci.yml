name: CI

on:
  push:
    branches: [main]
  pull_request:
  # security-autofix dispatches this: runs started by GITHUB_TOKEN never trigger push or pull_request.
  workflow_dispatch:
  # Weekly, for the coverage figure and to re-check main against dependency drift.
  schedule:
    - cron: "13 5 * * 1"

permissions:
  contents: read

# Runs on main always finish, so every commit there keeps its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install --require-hashes -r scripts/requirements-dev.txt

      - name: Lint Python
        run: ruff check scripts

      - name: Run pytest
        run: python -m pytest scripts/tests/ -q

  # firestore.rules is the only guard on what the public web config can reach.
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "npm"

      # The Firestore emulator needs Java 21; the runner ships it, not as default.
      - name: Use the preinstalled JDK 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      # Shared with E2E under the same key: a hit skips `npm ci`.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # The emulator jar is a download of its own on every run otherwise.
      - name: Restore the Firestore emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - name: Test the Firestore rules against the emulator
        run: npm run test:rules

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "npm"

      # Shared with E2E under the same key: a hit skips `npm ci`.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify no private data is committed
        run: npm run verify:private-data

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check import cycles
        run: npm run check:cycles

  # Two shards beside verify: a private repository's runner has two cores, and vitest leaves one idle by default.
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request') && '[1, 2]' || '[1]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "npm"

      # Shared with E2E under the same key: a hit skips `npm ci`.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Coverage doubles the suite's time, so only the weekly and manual runs collect it.
      - name: Test
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npm test -- --shard=${{ matrix.shard }}/2 --maxWorkers=2

      - name: Test, with coverage
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        run: npx vitest run --maxWorkers=2 --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node -e '
            const { total } = require("./coverage/coverage-summary.json")
            const rows = ["lines", "statements", "functions", "branches"].map((k) => `| ${k} | ${total[k].pct}% |`)
            console.log(["| Coverage | |", "|---|---:|", ...rows].join("\n"))
          ' >> "$GITHUB_STEP_SUMMARY"
