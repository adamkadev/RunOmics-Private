name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-dev.txt

      - name: Run pytest
        run: python -m pytest scripts/tests/ -q

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # This existed and nothing ran it. It is the guard against committing the
      # real dataset, a service-account key or an API key into a repository
      # whose whole privacy model is "the data lives somewhere else" - which is
      # exactly the kind of check that is worthless as a thing you remember to
      # run by hand.
      - name: Verify no private data is committed
        run: npm run verify:private-data

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test