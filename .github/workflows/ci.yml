name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a branch be checked without opening a pull request, and lets
  # security-autofix run the checks on the branch it pushes: runs started by
  # GITHUB_TOKEN never trigger push or pull_request workflows, dispatch excepted.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run's result moot.
# Runs on main always finish, so every commit there keeps its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements-dev.txt

      - name: Run pytest
        run: python -m pytest scripts/tests/ -q

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify no private data is committed
        run: npm run verify:private-data

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
