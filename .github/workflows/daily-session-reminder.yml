name: Daily Session Reminder

on:
  schedule:
    # 08:11 in Paris in summer; off the hour because GitHub delays on-the-hour schedules the most.
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    uses: ./.github/workflows/internal-notify.yml
    # Only the secrets the job reads, not every one this repository holds.
    secrets:
      APP_URL: ${{ secrets.APP_URL }}
      INTERNAL_NOTIFY_SECRET: ${{ secrets.INTERNAL_NOTIFY_SECRET }}
    with:
      endpoint: daily-session
      label: Trigger daily session reminder
