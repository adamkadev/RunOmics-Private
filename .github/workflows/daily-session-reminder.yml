name: Daily Session Reminder

on:
  schedule:
    # 06:11 UTC is 08:11 in Paris in summer. Scheduled runs on the hour are the
    # ones GitHub delays most (this one arrived four to seven hours late), so
    # every schedule here sits off the hour.
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    uses: ./.github/workflows/internal-notify.yml
    secrets: inherit
    with:
      endpoint: daily-session
      label: Trigger daily session reminder
