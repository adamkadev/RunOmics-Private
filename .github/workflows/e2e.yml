name: E2E

# Not on pull requests: a run is about 3 min, most of it install and
# `next build`, and PRs wait on CI (lint, types, unit tests) alone. It runs
# on every push to main, and on demand for a branch (Actions → E2E → Run
# workflow) before merging anything risky.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Shared with CI under the same key: a hit skips `npm ci`.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Read Playwright's version
        id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      # Chromium's headless shell needs no apt step: the runner image ships Chrome and its libraries.
      - name: Restore Playwright's browsers
        id: playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-webkit-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright's browsers
        if: steps.playwright.outputs.cache-hit != 'true'
        run: |
          for try in 1 2 3; do
            npx playwright install --only-shell chromium && npx playwright install webkit && exit 0
            sleep 15
          done
          exit 1

      - name: Name the week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # The Azure mirror has served these 117 MB at 50 KB/s: a week's .debs from the cache leave apt nothing to fetch.
      - name: Restore WebKit's system packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/webkit-apt
          key: webkit-apt-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ steps.week.outputs.week }}
          restore-keys: webkit-apt-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-

      # The iPhone and sparse-fr projects run in WebKit, whose system libraries the runner image does not ship.
      # apt has hung for a whole job and crawled on a slow mirror: each try gets its own 3 minutes.
      - name: Install WebKit's system libraries
        timeout-minutes: 10
        run: |
          # A try cut short leaves its apt-get running under sudo, holding the lock: the next waits for it, not fails.
          echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/90-lock-timeout > /dev/null
          mkdir -p ~/.cache/webkit-apt/partial
          printf 'Dir::Cache::Archives "%s";\n' "$HOME/.cache/webkit-apt" | sudo tee /etc/apt/apt.conf.d/90-webkit-cache > /dev/null
          status=1
          for try in 1 2 3; do
            if timeout -k 10 180 npx playwright install-deps webkit; then
              status=0
              break
            fi
            sudo pkill -x apt-get || true
            sleep 5
          done
          # apt writes as root; the cache is saved as the runner user.
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/webkit-apt
          echo "$(find ~/.cache/webkit-apt -maxdepth 1 -name '*.deb' | wc -l) package(s) in the cache."
          exit "$status"

      # The owner's specs run against the Auth and Firestore emulators, which need Java 21; the runner ships it, not as default.
      - name: Use the preinstalled JDK 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      - name: Restore the Firebase emulators
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      # Turbopack's cache cut a build from 39 s to 13 s; one entry a week, saved from main, keeps it under GitHub's 10 GB.
      - name: Restore the Next.js build cache
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .next/cache
            .next-e2e-sparse/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Save the Next.js build cache
        if: github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .next/cache
            .next-e2e-sparse/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
