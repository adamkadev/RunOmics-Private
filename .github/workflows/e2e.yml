name: E2E

# Not on pull requests: a run is about 3 min, most of it install and
# `next build`, and PRs wait on CI (lint, types, unit tests) alone. It runs
# on every push to main, and on demand for a branch (Actions → E2E → Run
# workflow) before merging anything risky.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Shared with CI under the same key: a hit skips `npm ci`.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Chromium's headless shell needs no apt step: the runner image ships Chrome and its libraries.
      - name: Restore Playwright's browsers
        id: playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright's browsers
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium && npx playwright install webkit

      # The iPhone layout spec runs in WebKit, whose system libraries the runner image does not ship.
      - name: Install WebKit's system libraries
        run: npx playwright install-deps webkit

      # Turbopack's persistent cache: a build with unchanged dependencies took
      # 13s instead of 39s locally. Keyed per commit so every run saves its
      # own, restored from the newest one built on the same lock file (new
      # dependencies invalidate it anyway).
      - name: Restore the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
