name: E2E

# Not on pull requests: a run is about 3 min, most of it install and
# `next build`, and PRs wait on CI (lint, types, unit tests) alone. It runs
# on every push to main, and on demand for a branch (Actions → E2E → Run
# workflow) before merging anything risky.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Shared with CI under the same key: a hit skips `npm ci`.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Read Playwright's version
        id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      # Chromium's headless shell needs no apt step: the runner image ships Chrome and its libraries.
      - name: Restore Playwright's browsers
        id: playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-webkit-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright's browsers
        if: steps.playwright.outputs.cache-hit != 'true'
        run: |
          for try in 1 2 3; do
            npx playwright install --only-shell chromium && npx playwright install webkit && exit 0
            sleep 15
          done
          exit 1

      # The iPhone layout spec runs in WebKit, whose system libraries the runner image does not ship.
      - name: Install WebKit's system libraries
        run: npx playwright install-deps webkit

      - name: Name the week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Turbopack's cache cut a build from 39 s to 13 s; one entry a week, saved from main, keeps it under GitHub's 10 GB.
      - name: Restore the Next.js build cache
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Save the Next.js build cache
        if: github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
