version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: github-actions
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: npm
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: monthly
    commit-message:
      prefix: pip
