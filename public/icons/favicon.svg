<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 512 512" role="img" aria-label="RunOmics">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0a1e17"></stop>
      <stop offset="100%" stop-color="#06091a"></stop>
    </linearGradient>
    <linearGradient id="tint" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity=".55"></stop>
      <stop offset="100%" stop-color="#064e3b" stop-opacity=".18"></stop>
    </linearGradient>
    <radialGradient id="spec" cx="50%" cy="0%" r="75%" fy="0%">
      <stop offset="0%" stop-color="white" stop-opacity=".58"></stop>
      <stop offset="50%" stop-color="white" stop-opacity=".10"></stop>
      <stop offset="100%" stop-color="white" stop-opacity="0"></stop>
    </radialGradient>
    <clipPath id="sq"><rect width="512" height="512" rx="114"></rect></clipPath>
  </defs>

  
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#base)"></rect>
    <rect width="512" height="512" fill="url(#tint)"></rect>
    
    <ellipse cx="256" cy="0" rx="288" ry="228" fill="url(#spec)"></ellipse>
    
    <rect y="400" width="512" height="112" fill="white" fill-opacity=".04"></rect>
  </g>

  
  <rect x="1" y="1" width="510" height="510" rx="113" fill="none" stroke="white" stroke-opacity=".22" stroke-width="1.5"></rect>

  
  <g fill="none" stroke="white" stroke-linecap="round">
    <circle cx="256" cy="256" r="230" stroke-width="30" stroke-opacity=".18"></circle>
    <circle cx="256" cy="256" r="150" stroke-width="46" stroke-opacity=".65"></circle>
    <circle cx="256" cy="256" r="68" stroke-width="46"></circle>
  </g>
</svg>